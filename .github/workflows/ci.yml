name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      PUBLIC_STORE_DOMAIN: ${{ secrets.PUBLIC_STORE_DOMAIN }}
      PUBLIC_STOREFRONT_API_TOKEN: ${{ secrets.PUBLIC_STOREFRONT_API_TOKEN }}
      WEAVERSE_PROJECT_ID: ${{ secrets.WEAVERSE_PROJECT_ID }}
      WEAVERSE_API_KEY: ${{ secrets.WEAVERSE_API_KEY }}
      JUDGEME_PRIVATE_API_TOKEN: ${{ secrets.JUDGEME_PRIVATE_API_TOKEN }}
      KLAVIYO_PRIVATE_API_TOKEN: ${{ secrets.KLAVIYO_PRIVATE_API_TOKEN }}
      PUBLIC_GOOGLE_GTM_ID: ${{ secrets.PUBLIC_GOOGLE_GTM_ID }}
      PUBLIC_SHOPIFY_INBOX_SHOP_ID: ${{ secrets.PUBLIC_SHOPIFY_INBOX_SHOP_ID }}

    steps:
    - uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 10

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm run biome

    - name: Build
      run: pnpm run build

    - name: Typecheck
      run: pnpm run typecheck

    - name: Test
      run: pnpm run test
