# Netlify configuration for Hydrogen deployment

[build]
  command = "DEPLOY_TARGET=netlify pnpm exec shopify hydrogen build --no-bundle-stats"
  publish = "dist/client"

[dev]
  command = "pnpm run dev"

# Set immutable caching for static files
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31560000, immutable"
